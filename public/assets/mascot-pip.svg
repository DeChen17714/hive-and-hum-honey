<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Glow behind Pip -->
  <circle cx="60" cy="60" r="50" fill="#F59E0B" fill-opacity="0.15" />
  
  <!-- Left Wing -->
  <ellipse cx="44" cy="38" rx="16" ry="24" transform="rotate(-30 44 38)" fill="#E0F2FE" fill-opacity="0.85" stroke="#38BDF8" stroke-width="2.5" />
  <path d="M44 26 C 46 36, 42 46, 40 54" stroke="#BAE6FD" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Right Wing -->
  <ellipse cx="76" cy="38" rx="16" ry="24" transform="rotate(30 76 38)" fill="#E0F2FE" fill-opacity="0.85" stroke="#38BDF8" stroke-width="2.5" />
  <path d="M76 26 C 74 36, 78 46, 80 54" stroke="#BAE6FD" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Antennae -->
  <path d="M52 44 C 48 30, 38 28, 34 32" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
  <circle cx="34" cy="32" r="3.5" fill="#F59E0B" />
  <path d="M68 44 C 72 30, 82 28, 86 32" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
  <circle cx="86" cy="32" r="3.5" fill="#F59E0B" />

  <!-- Body -->
  <rect x="36" y="44" width="48" height="52" rx="24" fill="#F59E0B" stroke="#0F172A" stroke-width="3.5" />
  
  <!-- Bee Stripes -->
  <path d="M37 58 Q 60 62 83 58" stroke="#0F172A" stroke-width="5" stroke-linecap="round"/>
  <path d="M37 72 Q 60 76 83 72" stroke="#0F172A" stroke-width="5" stroke-linecap="round"/>
  <path d="M42 85 Q 60 88 78 85" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Stinger -->
  <path d="M56 96 L60 104 L64 96 Z" fill="#0F172A" />

  <!-- Face / Cheeks -->
  <circle cx="50" cy="52" r="3" fill="#0F172A" />
  <circle cx="70" cy="52" r="3" fill="#0F172A" />
  <circle cx="45" cy="56" r="3.5" fill="#FB7185" fill-opacity="0.7" />
  <circle cx="75" cy="56" r="3.5" fill="#FB7185" fill-opacity="0.7" />
  <!-- Smile -->
  <path d="M56 56 Q 60 60 64 56" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Tiny Honey Drop in Pip's hand -->
  <path d="M84 66 C 84 60, 92 56, 92 64 C 92 70, 84 72, 84 66 Z" fill="#FBBF24" stroke="#D97706" stroke-width="1.5"/>
</svg>
